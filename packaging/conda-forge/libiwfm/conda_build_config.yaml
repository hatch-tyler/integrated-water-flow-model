# ifx on both platforms. 2026.1.1 is the compiler DWR built the official
# IWFM 2026.0.1848 release with; it reproduces the official results exactly.
fortran_compiler:
  - ifx
fortran_compiler_version:
  - 2026.1.1
# ifx needs glibc 2.28 on Linux
c_stdlib_version:             # [linux]
  - "2.28"                    # [linux]
